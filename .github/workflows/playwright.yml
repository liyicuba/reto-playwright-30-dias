name: Playwright Tests Updated
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Grep for specific test'
        required: false
        default: ''
        type: string
      project:
        description: 'selecciona el proyecto a ejecutar'
        required: true
        default: 'admin'
        type: choice
        options:
          - admin
          - employee
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: dev
    env:
      ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      EMPLOYEE_USERNAME: ${{ vars.EMPLOYEE_USERNAME }}
      EMPLOYEE_PASSWORD: ${{ secrets.EMPLOYEE_PASSWORD }}
      WRONG_PASSWORD: ${{ secrets.WRONG_PASSWORD }}
      PROJECT: ${{ github.event.inputs.project || 'admin' }}
      GREP: ${{ github.event.inputs.grep || '' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests 
      run: |
        if [ -n "${{ github.event.inputs.grep }}" ]; then
          npx playwright test --grep "$GREP" --project="$PROJECT"
        else
          npx playwright test --project="$PROJECT"
        fi
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
